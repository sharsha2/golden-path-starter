name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t golden-path:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: golden-path:ci
          severity: HIGH,CRITICAL

  oidc-demo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # lets the job request an OIDC token
      contents: read
    steps:
      - name: Mint an OIDC token and show its claims
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const token = await core.getIDToken();
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            const { sub, aud, repository, ref, iat, exp } = claims;
            core.info(JSON.stringify({ sub, aud, repository, ref, iat, exp }, null, 2));
            core.info(`Token lifetime: ${(exp - iat) / 60} minutes`);
